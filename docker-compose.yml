services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg17
    environment:
      POSTGRES_USER: verimed
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set a local PostgreSQL password}
      POSTGRES_DB: verimed
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      [
        "postgres:/var/lib/postgresql/data",
        "./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verimed -d verimed"]
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:9.1.3
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  hapi:
    image: hapiproject/hapi:v8.10.3
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/fhir
      spring.datasource.username: verimed
      spring.datasource.password: ${LOCAL_POSTGRES_PASSWORD:?set a local PostgreSQL password}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
  minio:
    image: verimed-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/docker
      dockerfile: Minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_USER:?set a local MinIO username}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:?set a local MinIO password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
  otel:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otelcol/verimed.yaml"]
    volumes: ["./infra/docker/otel.yaml:/etc/otelcol/verimed.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
volumes:
  postgres:
  minio:
