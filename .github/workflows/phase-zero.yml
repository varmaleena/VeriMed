name: Phase 0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Build pinned CKS Linux runtime
        shell: pwsh
        run: ./scripts/Build-CksBundle.ps1
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: pnpm --filter @verimed/cdk build
      - run: pnpm --filter @verimed/web typecheck
      - run: pnpm --filter @verimed/web build
      - run: uv run --all-packages python services/api/export_platform_schema.py
      - run: git diff --exit-code -- services/api/migrations/003_platform.sql
      - run: uv run --all-packages alembic -c services/api/alembic.ini upgrade head --sql
      - run: uv run --all-packages python services/api/export_openapi.py
      - run: uv run --all-packages python services/api/export_ledger_schema.py
      - run: uv run --all-packages python services/cks/export_schema.py
      - run: uv run --all-packages python services/simulator/export_schema.py
      - run: pnpm --filter @verimed/api-client generate
      - run: git diff --exit-code -- packages/api-client/openapi.json packages/api-client/schema.d.ts packages/api-client/ledger-anchor-job.schema.json packages/api-client/cks.schema.json packages/api-client/cks.openapi.json packages/api-client/cks-api.d.ts packages/api-client/cks-reference-request.schema.json packages/api-client/fhir-import-job.schema.json packages/api-client/synthea-generation-job.schema.json
      - run: make test
      - run: make synth
      - run: pnpm --filter @verimed/cdk exec cdk synth CellLedger -c cellLedger=true --output cdk.out/ci-ledger
      - run: pnpm --filter @verimed/cdk exec cdk synth CellLedger -c cellLedger=true -c cellLedgerWorker=true --output cdk.out/ci-ledger-worker
        env:
          VERIMED_API_BUNDLE: ${{ github.workspace }}/services/api
          VERIMED_TENANT_ID: fe54cd8b-3dac-43d3-9a30-1f588cb60d35
          DATABASE_CLUSTER_ARN: arn:aws:rds:us-east-1:123456789012:cluster:ci-only
          DATABASE_RUNTIME_SECRET_ARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:ci-reader-ABCDEF
          DATABASE_KEY_ARN: arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000001
      - run: pnpm --filter @verimed/cdk exec cdk synth CellWorklist -c cellWorklist=true --output cdk.out/ci-worklist
        env:
          VERIMED_API_BUNDLE: ${{ github.workspace }}/services/api
          AUTH_COGNITO_ID: ci-synthesis-only
          AUTH_COGNITO_ISSUER: https://example.invalid
          VERIMED_TENANT_ID: fe54cd8b-3dac-43d3-9a30-1f588cb60d35
      - run: pnpm --filter @verimed/cdk exec cdk synth CellFhirDemo -c cellFhirDemo=true --output cdk.out/ci-fhir
        env:
          VERIMED_FHIR_EXPIRES_AT: "2099-01-01T00:00:00Z"
  synthea-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run --all-packages python services/simulator/prepare_image.py
      - run: docker build --platform linux/arm64 -f services/simulator/container/Dockerfile -t verimed-synthea:check .
      - name: Generate one real patient in the locked-down container
        run: docker run --rm --network none --read-only --memory 2g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --entrypoint timeout verimed-synthea:check --signal=TERM --kill-after=20s 10m python -m simulator.container_smoke
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --severity HIGH,CRITICAL --exit-code 1 verimed-synthea:check
  cks-cache-integration:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run --all-packages python services/cks/cache_integration.py --allow-local --output docs/cks-cache-verification.json
        env:
          VALKEY_URL: valkey://127.0.0.1:6379/0
  platform-schema-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg17
        env:
          POSTGRES_USER: verimed
          POSTGRES_DB: verimed
          # Isolated ephemeral CI database, no PHI or persistent credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verimed -d verimed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://verimed@127.0.0.1:5432/verimed
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run --all-packages alembic -c services/api/alembic.ini upgrade head
      - run: uv run --all-packages python services/api/tests/sql_schema_integration.py
      - run: uv run --all-packages alembic -c services/api/alembic.ini upgrade head
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
      - run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /repo
      - run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.185.0 semgrep scan --config p/default --error /src
