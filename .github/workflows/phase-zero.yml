name: Phase 0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: pnpm --filter @verimed/cdk build
      - run: pnpm --filter @verimed/web typecheck
      - run: pnpm --filter @verimed/web build
      - run: uv run --all-packages python services/api/export_openapi.py
      - run: uv run --all-packages python services/api/export_ledger_schema.py
      - run: uv run --all-packages python services/cks/export_schema.py
      - run: pnpm --filter @verimed/api-client generate
      - run: git diff --exit-code -- packages/api-client/openapi.json packages/api-client/schema.d.ts packages/api-client/ledger-anchor-job.schema.json packages/api-client/cks.schema.json
      - run: make test
      - run: make synth
      - run: pnpm --filter @verimed/cdk exec cdk synth CellLedger -c cellLedger=true --output cdk.out/ci-ledger
      - run: pnpm --filter @verimed/cdk exec cdk synth CellLedger -c cellLedger=true -c cellLedgerWorker=true --output cdk.out/ci-ledger-worker
        env:
          VERIMED_API_BUNDLE: ${{ github.workspace }}/services/api
          VERIMED_TENANT_ID: fe54cd8b-3dac-43d3-9a30-1f588cb60d35
          DATABASE_CLUSTER_ARN: arn:aws:rds:us-east-1:123456789012:cluster:ci-only
          DATABASE_RUNTIME_SECRET_ARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:ci-reader-ABCDEF
          DATABASE_KEY_ARN: arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000001
      - run: pnpm --filter @verimed/cdk exec cdk synth CellWorklist -c cellWorklist=true --output cdk.out/ci-worklist
        env:
          VERIMED_API_BUNDLE: ${{ github.workspace }}/services/api
          AUTH_COGNITO_ID: ci-synthesis-only
          AUTH_COGNITO_ISSUER: https://example.invalid
          VERIMED_TENANT_ID: fe54cd8b-3dac-43d3-9a30-1f588cb60d35
      - run: pnpm --filter @verimed/cdk exec cdk synth CellFhirDemo -c cellFhirDemo=true --output cdk.out/ci-fhir
        env:
          VERIMED_FHIR_EXPIRES_AT: "2099-01-01T00:00:00Z"
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
      - run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /repo
      - run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.185.0 semgrep scan --config p/default --error /src
