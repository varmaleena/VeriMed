name: Web production bundle
on:
  workflow_dispatch:
  push:
    paths:
      - apps/web/**
      - scripts/package_web.py
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @verimed/web typecheck
      - run: pnpm --filter @verimed/web test
      - run: pnpm --filter @verimed/web build
      - run: python scripts/package_web.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chartvigil-web-linux
          path: .phase1-api/web-build/
          include-hidden-files: true
          retention-days: 3
