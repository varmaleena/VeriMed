name: Synthea dependency remediation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/synthea-security.yml
      - services/simulator/container/security-overrides.gradle
      - services/simulator/container/patch_source.py
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthetichealth/synthea
          ref: 0185c09ea9d10a822c6f5f3ef9bdcbcbe960c813
          path: .build-synthea/source
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: python services/simulator/container/patch_source.py .build-synthea/source
      - name: Build pinned source with fixed dependencies
        working-directory: .build-synthea/source
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -I ../../services/simulator/container/security-overrides.gradle shadowJar
      - name: Scan candidate JAR without weakening the security gate
        run: |
          docker run --rm -v "$PWD/.build-synthea/source/build/libs:/scan:ro" -v "$PWD/.build-synthea:/reports" aquasec/trivy:0.76.2 fs --scanners vuln --severity HIGH,CRITICAL --format json --output /reports/candidate-scan.json --exit-code 1 /scan
      - name: Generate a real patient without network access
        working-directory: .build-synthea/source
        run: |
          mkdir -p /tmp/synthea-candidate
          sudo unshare --net -- env PATH="$PATH" timeout 10m java -Xmx1024m -jar build/libs/synthea-with-dependencies.jar -p 1 --exporter.baseDirectory=/tmp/synthea-candidate --exporter.fhir.export=true --exporter.fhir.transaction_bundle=true > /tmp/synthea-candidate/generation.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          patients = set()
          for path in Path('/tmp/synthea-candidate/fhir').glob('*.json'):
              bundle = json.loads(path.read_bytes())
              for entry in bundle.get('entry', []):
                  resource = entry.get('resource', {})
                  if resource.get('resourceType') == 'Patient':
                      patients.add(resource['id'])
          assert len(patients) == 1, 'Real FHIR generation failed'
          print('Real FHIR patient generation passed')
          PY
      - name: Record candidate integrity
        working-directory: .build-synthea/source/build/libs
        run: sha256sum synthea-with-dependencies.jar > synthea.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-synthea-candidate
          path: |
            .build-synthea/source/build/libs/synthea-with-dependencies.jar
            .build-synthea/source/build/libs/synthea.sha256
            .build-synthea/candidate-scan.json
          retention-days: 3
