name: Synthea dependency remediation
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated code artifact prerelease
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/synthea-security.yml
      - services/simulator/container/security-overrides.gradle
      - services/simulator/container/patch_source.py
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthetichealth/synthea
          ref: 0185c09ea9d10a822c6f5f3ef9bdcbcbe960c813
          path: .build-synthea/source
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: python services/simulator/container/patch_source.py .build-synthea/source
      - name: Build pinned source with fixed dependencies
        working-directory: .build-synthea/source
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -I ../../services/simulator/container/security-overrides.gradle shadowJar
      - name: Scan candidate JAR without weakening the security gate
        run: |
          printf 'FROM scratch\nCOPY synthea-with-dependencies.jar /opt/synthea.jar\n' > .build-synthea/source/build/libs/scan.Dockerfile
          docker build -f .build-synthea/source/build/libs/scan.Dockerfile -t synthea-security:candidate .build-synthea/source/build/libs
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.build-synthea:/reports" aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --list-all-pkgs --format json --output /reports/candidate-scan.json synthea-security:candidate
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.build-synthea/candidate-scan.json').read_text())
          packages = [p for result in report.get('Results', []) if result.get('Type') == 'jar' for p in result.get('Packages', [])]
          assert len(packages) >= 100, 'Embedded Java inventory is missing or incomplete'
          print(f'Inventoried {len(packages)} embedded Java packages')
          findings = [v for result in report.get('Results', []) for v in result.get('Vulnerabilities', []) if v['Severity'] in ('HIGH', 'CRITICAL')]
          for finding in findings:
              print(finding['PkgName'], finding['InstalledVersion'], finding['VulnerabilityID'], finding.get('FixedVersion', 'unfixed'))
          assert not findings, 'HIGH/CRITICAL Java findings block promotion'
          PY
      - name: Generate a real patient without network access
        working-directory: .build-synthea/source
        run: |
          mkdir -p /tmp/synthea-candidate
          sudo unshare --net -- env PATH="$PATH" timeout 10m java -Xmx1024m -jar build/libs/synthea-with-dependencies.jar -p 1 --generate.only_alive_patients=true --exporter.baseDirectory=/tmp/synthea-candidate --exporter.fhir.export=true --exporter.fhir.transaction_bundle=true > /tmp/synthea-candidate/generation.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          patients = set()
          for path in Path('/tmp/synthea-candidate/fhir').glob('*.json'):
              bundle = json.loads(path.read_bytes())
              for entry in bundle.get('entry', []):
                  resource = entry.get('resource', {})
                  if resource.get('resourceType') == 'Patient':
                      patients.add(resource['id'])
          import re
          log = Path('/tmp/synthea-candidate/generation.log').read_text(errors='replace')
          print('FHIR patient count:', len(patients))
          print('Generation exception classes:', sorted(set(re.findall(r'[\w.]+(?:Exception|Error)', log))))
          assert len(patients) == 1, 'Real FHIR generation failed'
          print('Real FHIR patient generation passed')
          PY
      - name: Record candidate integrity
        working-directory: .build-synthea/source/build/libs
        run: sha256sum synthea-with-dependencies.jar > synthea.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthea-security-candidate
          path: |
            .build-synthea/source/build/libs/synthea-with-dependencies.jar
            .build-synthea/source/build/libs/synthea.sha256
            .build-synthea/candidate-scan.json
          retention-days: 3
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish only the passing code artifact and security report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name synthea-security-candidate --dir candidate
          python - <<'PY'
          import shutil
          from pathlib import Path
          destination = Path('release')
          destination.mkdir()
          for name in ('synthea-with-dependencies.jar', 'synthea.sha256', 'candidate-scan.json'):
              matches = list(Path('candidate').rglob(name))
              assert len(matches) == 1, 'Ambiguous candidate artifact layout'
              shutil.copyfile(matches[0], destination / name)
          PY
          cd release
          sha256sum --check synthea.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('candidate-scan.json').read_text())
          packages = [p for result in report.get('Results', []) if result.get('Type') == 'jar' for p in result.get('Packages', [])]
          assert len(packages) >= 100
          assert not [v for result in report.get('Results', []) for v in result.get('Vulnerabilities', []) if v['Severity'] in ('HIGH', 'CRITICAL')]
          PY
          gh release create synthea-4.0.0-security.1 --target "$GITHUB_SHA" --draft --prerelease --title 'Synthea 4.0.0 security dependency rebuild' --notes "Pinned upstream source 0185c09ea9d10a822c6f5f3ef9bdcbcbe960c813 and reviewed dependency compatibility patches. Inventoried Java scan and offline real FHIR generation passed in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No patient data is published." synthea-with-dependencies.jar synthea.sha256 candidate-scan.json
          gh release edit synthea-4.0.0-security.1 --draft=false
