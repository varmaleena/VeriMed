// Source-only candidate: keep the deployed JAR unchanged until scan AND real generation pass.
// Exact releases verified against Maven Central on 2026-11-22.
allprojects {
  configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
      def group = details.requested.group
      def name = details.requested.name
      def pins = [
        'com.google.guava:guava': '33.8.0-jre',
        'com.thoughtworks.xstream:xstream': '1.4.21',
        'commons-beanutils:commons-beanutils': '1.11.0',
        'commons-io:commons-io': '2.22.0',
        'net.minidev:json-smart': '2.6.1',
        'org.apache.commons:commons-compress': '1.28.0',
        'org.apache.commons:commons-text': '1.15.0',
        'org.fhir:ucum': '1.0.10',
        'org.yaml:snakeyaml': '2.7'
      ]
      if (group == 'ca.uhn.hapi.fhir' && name.startsWith('org.hl7.fhir.')) {
        details.useVersion('6.9.10')
      } else if (group == 'com.fasterxml.jackson.core' && name == 'jackson-annotations') {
        // Jackson 2.23 annotations use a minor-only version; follow the library BOM.
        details.useVersion('2.23')
      } else if (group != null && group.startsWith('com.fasterxml.jackson.')) {
        details.useVersion('2.23.0')
      } else if (pins.containsKey(group + ':' + name)) {
        details.useVersion(pins[group + ':' + name])
      }
    }
  }
}
